<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buck — Degrau de razão cíclica</title><style>body{font:15px system-ui;background:#f3f6fa;color:#18283a;margin:0}main{max-width:900px;margin:auto;padding:18px}section{background:white;border:1px solid #dce3eb;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}label{display:block;font-weight:600}input[type=range]{width:100%;accent-color:#176eaa}input[type=number]{width:85px;padding:5px}button,select{padding:9px;margin:8px 5px 0 0}canvas{width:100%;height:190px;display:block}.metric{background:#eef4fa;padding:10px;border-radius:8px}.metric b{display:block;font-size:19px}small{color:#526479}</style><main><h1>Buck — Degrau de razão cíclica</h1><p>Modelo chaveado ideal (CCM/DCM) e modelo médio (CCM). Condição inicial em regime permanente.</p><section><div id="controls" class="grid"></div><label for="mode">Modelo</label><select id="mode"><option value="sw">Chaveado</option><option value="avg">Médio CCM</option></select><button id="reset">Restaurar valores</button></section><section id="metrics" class="grid"></section><section id="plots"></section><p id="note"></p><p>Modelo médio: L di/dt = d Vin − v; C dv/dt = i − v/R. Gvd(s) = Vin / (LC s² + Ls/R + 1). Componentes ideais, carga resistiva, malha aberta.</p></main><script>
const defs=[['vin','Tensão de entrada','V',5,100,1,48],['l','Indutância','µH',10,1000,5,200],['c','Capacitância','µF',10,1000,5,220],['f','Frequência de comutação','kHz',5,200,1,50],['r','Resistência de carga','Ω',1,100,1,10],['d1','Razão cíclica inicial','%',5,95,1,40],['d2','Razão cíclica final','%',5,95,1,60],['ts','Instante do degrau','ms',0.5,10,.5,2],['tf','Tempo após o degrau','ms',1,50,1,10]];
const $=id=>document.getElementById(id),p={};let pending=false;
for(const [k,label,u,min,max,step,val] of defs){p[k]=val;let el=document.createElement('div');el.innerHTML=`<label for="${k}n">${label}</label><input id="${k}s" aria-label="${label}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"><div><input id="${k}n" type="number" min="${min}" max="${max}" step="${step}" value="${val}"> ${u}</div>`;$('controls').append(el);for(const s of ['s','n'])$(k+s).addEventListener(s==='s'?'input':'change',e=>{p[k]=Math.max(min,Math.min(max,Number(e.target.value)||min));$(k+'s').value=$(k+'n').value=p[k];schedule()})}
$('mode').onchange=schedule;$('reset').onclick=()=>{for(const [k,,,,,,v] of defs)$(k+'s').value=$(k+'n').value=p[k]=v;$('mode').value='sw';schedule()};
const plots=[['d','Razão cíclica (%)','#7854b5'],['v','Tensão de saída (V)','#176eaa'],['i','Corrente no indutor (A)','#bd760c']];for(const [k,label] of plots){let e=document.createElement('div');e.innerHTML=`<h3>${label}</h3><canvas id="plot${k}"></canvas>`;$('plots').append(e)}
function schedule(){if(!pending){pending=true;requestAnimationFrame(()=>{pending=false;run()})}}
function simulate(p,sw){let V=p.vin,L=p.l*1e-6,C=p.c*1e-6,R=p.r,T=1/(p.f*1000),D1=p.d1/100,D2=p.d2/100,ts=p.ts/1000,tf=ts+p.tf/1000,i=V*D1/R,v=V*D1;
let n=Math.max(60,Math.ceil(T/(.06*Math.min(Math.sqrt(L*C),R*C,L/R))));
function advance(d,h,on){function deriv(a,b){return [sw?(!on&&a<=0&&b>=0?0:((on?V:0)-b)/L):(d*V-b)/L,((sw?Math.max(0,a):a)-b/R)/C]}let a=deriv(i,v),b=deriv(i+a[0]*h/2,v+a[1]*h/2),c=deriv(i+b[0]*h/2,v+b[1]*h/2),e=deriv(i+c[0]*h,v+c[1]*h);i+=h*(a[0]+2*b[0]+2*c[0]+e[0])/6;v+=h*(a[1]+2*b[1]+2*c[1]+e[1])/6;if(sw)i=Math.max(0,i)}
function cycle(d,base,limit,record){let m=Math.max(1,Math.min(n-1,Math.round(n*d)));for(let j=0;j<n;j++){let on=j<m,t=base+(on?j*d*T/m:d*T+(j-m)*(1-d)*T/(n-m)),h=on?d*T/m:(1-d)*T/(n-m);if(t>=limit-1e-14)break;if(record)record(t,d);advance(d,Math.min(h,limit-t),on)}}
let conv=!sw;if(sw)for(let k=0;k<Math.min(10000,Math.floor(1800000/n));k++){let a=i,b=v;cycle(D1,0,T);if(k>10&&Math.abs(a-i)<1e-7*Math.max(1,i)&&Math.abs(b-v)<1e-7*Math.max(1,v)){conv=true;break}}
let data=[],minI=Infinity,maxV=-Infinity,minV=Infinity,stride=Math.max(1,Math.ceil(tf/T*n/24000)),count=0;
function record(t,d){if(t>=ts-1e-12){maxV=Math.max(maxV,v);minV=Math.min(minV,v);minI=Math.min(minI,i)}if(count++%stride===0)data.push({t:t*1000,d:d*100,v,i})}
for(let k=0;k*T<ts-1e-12;k++)cycle(D1,k*T,ts,record);data.push({t:ts*1000,d:D1*100,v,i},{t:ts*1000,d:D2*100,v,i});for(let k=0;ts+k*T<tf-1e-12;k++)cycle(D2,ts+k*T,tf,record);record(tf,D2);data.push({t:tf*1000,d:D2*100,v,i});return {data,minI,maxV,minV,conv,fn:1/(2*Math.PI*Math.sqrt(L*C)),z:Math.sqrt(L/C)/(2*R),tf:tf*1000,ts:ts*1000};}
function run(){let sw=$('mode').value==='sw',a=simulate(p,sw);let m=[['Tensão inicial ideal (CCM)',(p.vin*p.d1/100).toFixed(2)+' V'],['Tensão final ideal (CCM)',(p.vin*p.d2/100).toFixed(2)+' V'],['Máxima tensão após degrau',a.maxV.toFixed(3)+' V'],['Mínima tensão após degrau',a.minV.toFixed(3)+' V'],['Frequência natural LC',a.fn.toFixed(1)+' Hz'],['Amortecimento ζ',a.z.toFixed(4)],['Corrente mínima após degrau',a.minI.toFixed(3)+' A'],['Condição inicial',a.conv?'Regime permanente':'Convergência não confirmada']];$('metrics').innerHTML=m.map(([k,v])=>`<div class="metric"><small>${k}</small><b>${v}</b></div>`).join('');$('note').textContent=sw?'RK4 com bloqueio aproximado de corrente negativa. O degrau reinicia a fase do PWM. A redução de pontos pode ocultar ondulações nos gráficos.':'Modelo médio linear CCM; corrente negativa indica possível violação da hipótese de CCM.';for(const [k,,color] of plots)draw($('plot'+k),a,k,color)}
function draw(c,a,k,color){let w=c.clientWidth||320,h=190,r=Math.min(2,devicePixelRatio||1);c.width=w*r;c.height=h*r;let g=c.getContext('2d');g.scale(r,r);let x0=54,x1=w-12,y0=10,y1=h-32,lo=Infinity,hi=-Infinity;for(let q of a.data){lo=Math.min(lo,q[k]);hi=Math.max(hi,q[k])}if(k==='d'){lo=0;hi=100}else{let pad=Math.max((hi-lo)*.12,.05);lo-=pad;hi+=pad}let X=t=>x0+t/a.tf*(x1-x0),Y=v=>y1-(v-lo)/(hi-lo)*(y1-y0);g.font='11px system-ui';g.fillStyle='#526479';g.strokeStyle='#dce3eb';for(let j=0;j<=4;j++){let y=y0+j*(y1-y0)/4;g.beginPath();g.moveTo(x0,y);g.lineTo(x1,y);g.stroke();g.textAlign='right';g.fillText((hi-j*(hi-lo)/4).toFixed(2),x0-5,y+3)}for(let j=0;j<=5;j++){let x=x0+j*(x1-x0)/5;g.beginPath();g.moveTo(x,y0);g.lineTo(x,y1);g.stroke();g.textAlign='center';g.fillText((a.tf*j/5).toFixed(1),x,y1+14)}g.fillText('Tempo (ms)',(x0+x1)/2,h-3);g.setLineDash([4,4]);g.strokeStyle='#c54b4b';g.beginPath();g.moveTo(X(a.ts),y0);g.lineTo(X(a.ts),y1);g.stroke();g.setLineDash([]);g.strokeStyle=color;g.lineWidth=1.5;g.beginPath();a.data.forEach((q,j)=>{if(j)g.lineTo(X(q.t),Y(q[k]));else g.moveTo(X(q.t),Y(q[k]))});g.stroke()}
run();window.addEventListener('resize',schedule);
</script></html>
